<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon-180.png">
<title>Create account · Attend</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body" data-role="public" data-page="register" data-base="">
<main class="auth-wrap">
  <div class="auth-brand"><b>Attend</b><span>Attendance and performance tracking</span></div>
  <div class="auth-card">
    <h1 id="regTitle">Create your account</h1>
    <div id="setupWarn" class="notice warn hidden">Attend is not connected to Appwrite yet. Set <span class="mono">projectId</span> and <span class="mono">databaseId</span> in <span class="mono">assets/js/config.js</span>.</div>
    <div class="role-pick" role="group" aria-label="Account type"><button type="button" data-role="student" class="active">I am a student</button><button type="button" data-role="lecturer">I am a lecturer</button></div>
    <form id="regForm" novalidate><div class="form-grid" id="regFields"></div><button class="btn block" id="regBtn" type="submit">Create student account</button></form>
    <p class="auth-switch" id="regSwitch">Already registered? <a href="login.html">Log in</a></p>
  </div>
</main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/appwrite.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/android-bridge.js"></script>
<script src="assets/js/face-verification.js"></script>
<script src="assets/js/courses.js"></script>
<script src="assets/js/attendance.js"></script>
<script src="assets/js/gradebook.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/student.js"></script>
<script src="assets/js/lecturer.js"></script>
</body>
</html>
