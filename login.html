<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon-180.png">
<title>Log in · Attend</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body" data-role="public" data-page="login" data-base="">
<main class="auth-wrap">
  <div class="auth-brand"><b>Attend</b><span>Attendance and performance tracking</span></div>
  <div class="auth-card">
    <h1>Log in</h1>
    <div id="setupWarn" class="notice warn hidden">Attend is not connected to Appwrite yet. Set <span class="mono">projectId</span> and <span class="mono">databaseId</span> in <span class="mono">assets/js/config.js</span>.</div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="pwToggle">Show</button></div></div>
      <button class="btn block" id="loginBtn" type="submit">Log in</button>
    </form>
    <p class="auth-switch"><a href="#" id="forgot">Forgot your password?</a></p>
    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </div>
</main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/appwrite.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/android-bridge.js"></script>
<script src="assets/js/face-verification.js"></script>
<script src="assets/js/courses.js"></script>
<script src="assets/js/attendance.js"></script>
<script src="assets/js/gradebook.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/student.js"></script>
<script src="assets/js/lecturer.js"></script>
</body>
</html>
